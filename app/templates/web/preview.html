{% extends "base.html" %}

{% block title %}Live Preview - TeslaMate Digest{% endblock %}

{% block content %}
<div class="space-y-6">

  <!-- CONTROLS BAR -->
  <div class="bg-white dark:bg-slate-900 rounded-xl p-4 border border-slate-200 dark:border-slate-800 shadow-sm flex flex-wrap items-center justify-between gap-4 transition-colors">
    <!-- FILTERS FORM -->
    <form method="GET" action="/preview" class="flex flex-wrap items-center gap-3">
      <div>
        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Timeframe</label>
        <select name="period" onchange="this.form.submit()" class="bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-xs rounded-lg px-3 py-2">
          <option value="last_month" {% if period == 'last_month' %}selected{% endif %}>Last Full Month (Default)</option>
          <option value="this_month" {% if period == 'this_month' %}selected{% endif %}>Current Month to Date</option>
          <option value="last_week" {% if period == 'last_week' %}selected{% endif %}>Last 7 Days (Weekly)</option>
          <option value="yesterday" {% if period == 'yesterday' %}selected{% endif %}>Yesterday (Daily)</option>
          <option value="wrapped" {% if period == 'wrapped' %}selected{% endif %}>🎉 Year in Review (Wrapped)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Vehicle</label>
        <select name="car_id" onchange="this.form.submit()" class="bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-xs rounded-lg px-3 py-2">
          <option value="" {% if not car_id %}selected{% endif %}>All Cars (Fleet View)</option>
          {% for c in cars %}
          <option value="{{ c.id }}" {% if car_id == c.id|string %}selected{% endif %}>{{ c.name }} (Model {{ c.model }})</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Email Theme</label>
        <select name="theme" onchange="this.form.submit()" class="bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white text-xs rounded-lg px-3 py-2 font-semibold">
          <option value="dark_modern" {% if selected_theme == 'dark_modern' %}selected{% endif %}>🌙 Dark Modern (Default)</option>
          <option value="clean_white" {% if selected_theme == 'clean_white' %}selected{% endif %}>⚪ Clean White & Red (Tesla Inspired)</option>
          <option value="clean_black" {% if selected_theme == 'clean_black' %}selected{% endif %}>⚫ Clean Black & Red (Tesla Inspired)</option>
          <option value="eco_green" {% if selected_theme == 'eco_green' %}selected{% endif %}>🌿 Eco-Green Theme</option>
          <option value="electric_blue" {% if selected_theme == 'electric_blue' %}selected{% endif %}>⚡ Electric Blue Theme</option>
          <option value="custom" {% if selected_theme == 'custom' %}selected{% endif %}>🎨 Custom User Template</option>
        </select>
      </div>
    </form>

    <!-- ACTIONS -->
    <div class="flex items-center space-x-3">
      <!-- VIEW WIDTH SWITCHER -->
      <div class="bg-slate-100 dark:bg-slate-950 p-1 rounded-lg border border-slate-300 dark:border-slate-800 flex space-x-1">
        <button id="view-desktop" onclick="setDeviceView('desktop')" class="px-2.5 py-1 text-xs font-semibold rounded bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm">Desktop</button>
        <button id="view-mobile" onclick="setDeviceView('mobile')" class="px-2.5 py-1 text-xs font-semibold rounded text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">Mobile</button>
      </div>

      <!-- DISPATCH TEST -->
      <form method="POST" action="/api/send-test" onsubmit="return confirm('Send this digest to {{ config.smtp.recipient_email }}?');">
        <input type="hidden" name="period" value="{{ period }}">
        <input type="hidden" name="car_id" value="{{ car_id or '' }}">
        <input type="hidden" name="theme" value="{{ selected_theme or '' }}">
        <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-xs flex items-center gap-1.5 shadow">
          <span>✉️</span> Send Test to Inbox
        </button>
      </form>
    </div>
  </div>

  {% if send_status %}
  <div class="p-4 rounded-lg {% if send_status.success %}bg-emerald-500/20 text-emerald-700 dark:text-emerald-300 border border-emerald-500/40{% else %}bg-red-500/20 text-red-700 dark:text-red-300 border border-red-500/40{% endif %} text-sm">
    {{ send_status.message }}
  </div>
  {% endif %}

  <!-- PREVIEW FRAME -->
  <div class="flex justify-center bg-slate-200 dark:bg-slate-950 p-4 sm:p-6 rounded-2xl border border-slate-300 dark:border-slate-800 overflow-hidden shadow-inner transition-colors">
    <div id="preview-container" class="w-full transition-all duration-300" style="max-width: 720px;">
      <iframe id="preview-iframe" class="w-full bg-white dark:bg-[#0b0f19] rounded-xl border border-slate-300 dark:border-slate-800 shadow-md" style="min-height: 850px; height: 100vh;"></iframe>
    </div>
  </div>

</div>

<script>
  // Populate iframe
  const iframe = document.getElementById('preview-iframe');
  const rawHtml = {{ rendered_html | tojson }};
  iframe.srcdoc = rawHtml;

  function setDeviceView(mode) {
    const container = document.getElementById('preview-container');
    const btnDesktop = document.getElementById('view-desktop');
    const btnMobile = document.getElementById('view-mobile');

    if (mode === 'mobile') {
      container.style.maxWidth = '390px';
      btnMobile.className = 'px-2.5 py-1 text-xs font-semibold rounded bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm';
      btnDesktop.className = 'px-2.5 py-1 text-xs font-semibold rounded text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white';
    } else {
      container.style.maxWidth = '720px';
      btnDesktop.className = 'px-2.5 py-1 text-xs font-semibold rounded bg-white dark:bg-slate-800 text-slate-900 dark:text-white shadow-sm';
      btnMobile.className = 'px-2.5 py-1 text-xs font-semibold rounded text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white';
    }
  }
</script>
{% endblock %}
