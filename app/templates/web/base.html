<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}TeslaMate Digest{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            tesla: '#e82127',
            slate: {
              850: '#151f33',
              900: '#0f172a',
              950: '#0b0f19',
            }
          }
        }
      }
    }
  </script>
  <script>
    // System theme matching by default with manual Light/Dark override
    function getThemePreference() {
      return localStorage.getItem('theme') || 'system';
    }

    function applyTheme() {
      const pref = getThemePreference();
      let isDark = false;
      if (pref === 'dark') {
        isDark = true;
      } else if (pref === 'light') {
        isDark = false;
      } else {
        // System preference default
        isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      }

      if (isDark) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      updateThemeIcon(pref);
    }

    function setTheme(pref) {
      localStorage.setItem('theme', pref);
      applyTheme();
    }

    function cycleTheme() {
      const current = getThemePreference();
      let next = 'system';
      if (current === 'system') next = 'light';
      else if (current === 'light') next = 'dark';
      else next = 'system';
      setTheme(next);
    }

    function updateThemeIcon(pref) {
      const label = document.getElementById('theme-label');
      const icon = document.getElementById('theme-icon');
      if (!icon) return;
      if (pref === 'light') {
        icon.textContent = '☀️';
        if (label) label.textContent = 'Light';
      } else if (pref === 'dark') {
        icon.textContent = '🌙';
        if (label) label.textContent = 'Dark';
      } else {
        icon.textContent = '💻';
        if (label) label.textContent = 'System';
      }
    }

    // Run immediately before body paints
    applyTheme();

    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (getThemePreference() === 'system') {
          applyTheme();
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateThemeIcon(getThemePreference());
    });
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">
  <!-- NAVBAR -->
  <nav class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-50 shadow-sm transition-colors duration-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <span class="text-tesla text-2xl font-black tracking-wider">⚡</span>
          <span class="font-extrabold text-xl tracking-tight text-slate-900 dark:text-white">TeslaMate <span class="text-tesla">Digest</span></span>
        </div>
        <div class="flex items-center space-x-1 sm:space-x-3">
          <a href="/" class="px-3 py-2 rounded-md text-sm font-medium {% if active_nav == 'dashboard' %}bg-slate-100 dark:bg-slate-800 text-tesla font-bold{% else %}text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-50 dark:hover:bg-slate-850{% endif %}">Dashboard</a>
          <a href="/preview" class="px-3 py-2 rounded-md text-sm font-medium {% if active_nav == 'preview' %}bg-slate-100 dark:bg-slate-800 text-tesla font-bold{% else %}text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-50 dark:hover:bg-slate-850{% endif %}">Live Preview</a>
          <a href="/builder" class="px-3 py-2 rounded-md text-sm font-medium {% if active_nav == 'builder' %}bg-slate-100 dark:bg-slate-800 text-tesla font-bold{% else %}text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-50 dark:hover:bg-slate-850{% endif %}">Template Builder</a>
          <a href="/maintenance" class="px-3 py-2 rounded-md text-sm font-medium {% if active_nav == 'maintenance' %}bg-slate-100 dark:bg-slate-800 text-tesla font-bold{% else %}text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-50 dark:hover:bg-slate-850{% endif %}">Maintenance</a>
          <a href="/settings" class="px-3 py-2 rounded-md text-sm font-medium {% if active_nav == 'settings' %}bg-slate-100 dark:bg-slate-800 text-tesla font-bold{% else %}text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-50 dark:hover:bg-slate-850{% endif %}">Delivery &amp; Schedules</a>
          <a href="/settings/integrations" class="px-3 py-2 rounded-md text-sm font-medium {% if active_nav == 'integrations' %}bg-slate-100 dark:bg-slate-800 text-tesla font-bold{% else %}text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-50 dark:hover:bg-slate-850{% endif %}">Rates &amp; Integrations</a>

          <!-- THEME TOGGLE BUTTON -->
          <button onclick="cycleTheme()" title="Toggle Theme (System / Light / Dark)" class="ml-2 p-2 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-xs font-semibold flex items-center gap-1.5 transition">
            <span id="theme-icon">💻</span>
            <span id="theme-label" class="hidden sm:inline text-xs text-slate-700 dark:text-slate-300">System</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- MAIN BODY -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- FOOTER -->
  <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500 dark:text-slate-400 transition-colors duration-200">
    TeslaMate Digest &bull; Built with FastAPI, Jinja2 & Matplotlib &bull; Open Source for the TeslaMate Community
  </footer>
</body>
</html>
