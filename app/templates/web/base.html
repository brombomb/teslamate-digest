<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}TeslaMate Digest{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            tesla: '#e82127',
            slate: {
              850: '#151f33',
              900: '#0f172a',
              950: '#0b0f19',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
  <!-- NAVBAR -->
  <nav class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
          <span class="text-tesla text-2xl font-black tracking-wider">⚡</span>
          <span class="font-extrabold text-xl tracking-tight text-white">TeslaMate <span class="text-tesla">Digest</span></span>
        </div>
        <div class="flex space-x-1 sm:space-x-4">
          <a href="/" class="px-3 py-2 rounded-md text-sm font-medium {% if active_nav == 'dashboard' %}bg-slate-800 text-white{% else %}text-slate-400 hover:text-white hover:bg-slate-850{% endif %}">Dashboard</a>
          <a href="/preview" class="px-3 py-2 rounded-md text-sm font-medium {% if active_nav == 'preview' %}bg-slate-800 text-white{% else %}text-slate-400 hover:text-white hover:bg-slate-850{% endif %}">Live Preview</a>
          <a href="/settings" class="px-3 py-2 rounded-md text-sm font-medium {% if active_nav == 'settings' %}bg-slate-800 text-white{% else %}text-slate-400 hover:text-white hover:bg-slate-850{% endif %}">Settings</a>
          <a href="/maintenance" class="px-3 py-2 rounded-md text-sm font-medium {% if active_nav == 'maintenance' %}bg-slate-800 text-white{% else %}text-slate-400 hover:text-white hover:bg-slate-850{% endif %}">Maintenance</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- MAIN BODY -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- FOOTER -->
  <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
    TeslaMate Digest &bull; Built with FastAPI, Jinja2 & Matplotlib &bull; Open Source for the TeslaMate Community
  </footer>
</body>
</html>
