# Add this service to your existing TeslaMate docker-compose.yml file:
#
# services:
#   ...
  teslamate-digest:
    container_name: teslamate-digest
    image: teslamate-digest:latest
    restart: unless-stopped
    ports:
      - 8660:8660
    environment:
      - TZ=UTC
      - DATABASE_HOST=database
      - DATABASE_PORT=5432
      - DATABASE_USER=teslamate
      - DATABASE_PASS=your_postgres_password # matches your postgres password
      - DATABASE_NAME=teslamate
      - GRAFANA_URL=http://grafana:3000
      - DATA_DIR=/app/data
    volumes:
      - ./teslamate-digest/data:/app/data
      - ./teslamate-digest/custom_templates:/app/custom_templates
    depends_on:
      - database
